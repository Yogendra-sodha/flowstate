name: Tests
on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras --group dev --python 3.12
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync pytest
      - name: Build and check the static viewer container
        if: runner.os == 'Linux'
        shell: bash
        run: |
          uv run --no-sync flowstate --lake outputs/viewer-ci run examples/burgers.json --stream
          uv run --no-sync flowstate --lake outputs/viewer-ci dashboard outputs/viewer-ci.html
          docker pull python:3.12-slim
          base_image=$(docker image inspect python:3.12-slim --format '{{index .RepoDigests 0}}')
          docker build --build-arg PYTHON_BASE="$base_image" --tag flowstate-viewer:ci containers/viewer
          uv run --no-sync python containers/viewer/smoke.py outputs/viewer-ci.html --image flowstate-viewer:ci --base-image "$base_image"
