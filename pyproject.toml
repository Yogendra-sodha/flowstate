[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "flowstate-research"
version = "0.1.0"
description = "Reproducible numerical PDE experiments and an immutable local experiment lake"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "numpy>=2.2,<3",
  "zarr>=3.1,<4",
  "duckdb>=1.3,<2",
  "pyarrow>=19,<24",
]

[project.scripts]
flowstate = "flowstate.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/flowstate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
