[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "flowstate-research"
version = "0.2.0"
description = "Reproducible numerical PDE experiments and an immutable local experiment lake"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "numpy>=2.2,<3",
  "zarr>=3.1,<4",
  "duckdb>=1.3,<2",
  "pyarrow>=19,<24",
  "scipy>=1.15,<2",
  "h5py>=3.12,<4",
]

[project.optional-dependencies]
ml = ["torch>=2.6,<3"]
s3 = ["boto3>=1.36,<2"]

[project.scripts]
flowstate = "flowstate.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "moto[s3]>=5,<6"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.hatch.build.targets.wheel]
packages = ["src/flowstate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
